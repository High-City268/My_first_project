<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEEP — Muthuvel Education Enhancement Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#1a3a5c;--brand-light:#e8f0f9;--brand-mid:#2d6a9f;
  --gold:#c9902a;--gold-light:#fdf4e3;
  --success:#2e7d5e;--success-bg:#e8f5ee;
  --danger:#b03030;--danger-bg:#fceaea;
  --warn:#b06000;--warn-bg:#fff3dc;
  --surface:#ffffff;--page:#f4f6f9;
  --text:#1a2233;--muted:#6b7a90;--border:rgba(0,0,0,0.1);
  --sidebar-w:220px;
}
body{font-family:'DM Sans',sans-serif;background:var(--page);color:var(--text);min-height:100vh;font-size:14px}

/* ── TOAST ── */
#toast-container{position:fixed;top:18px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;min-width:260px;max-width:340px;
  box-shadow:0 4px 20px rgba(0,0,0,0.15);animation:slideIn .25s ease;display:flex;align-items:center;gap:8px}
.toast.success{background:#2e7d5e;color:#fff}.toast.error{background:#b03030;color:#fff}
.toast.info{background:#1a3a5c;color:#fff}.toast.warn{background:#c9902a;color:#fff}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ── LOGIN ── */
#login-screen{min-height:100vh;background:linear-gradient(135deg,#0d2540 0%,#1a4a7a 50%,#0d2540 100%);
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#login-screen::before{content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle at 20% 50%,rgba(201,144,42,.08) 0%,transparent 50%),
                   radial-gradient(circle at 80% 20%,rgba(45,106,159,.15) 0%,transparent 40%)}
.login-card{background:rgba(255,255,255,.97);border-radius:16px;padding:40px 44px;width:420px;
  position:relative;z-index:1;box-shadow:0 24px 80px rgba(0,0,0,.3)}
.logo-emblem{width:64px;height:64px;border-radius:50%;background:var(--brand);display:flex;
  align-items:center;justify-content:center;margin:0 auto 12px;
  font-family:'Playfair Display',serif;font-size:22px;color:var(--gold);font-weight:600}
.logo-name{font-family:'Playfair Display',serif;font-size:18px;color:var(--brand);font-weight:600;line-height:1.2;text-align:center}
.logo-sub{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.5px;text-align:center;display:block}
.role-tabs{display:flex;gap:6px;margin:20px 0;background:var(--page);border-radius:8px;padding:4px}
.role-tab{flex:1;padding:7px 8px;border:none;border-radius:6px;background:transparent;cursor:pointer;
  font-size:12px;font-family:'DM Sans',sans-serif;font-weight:500;color:var(--muted);transition:all .2s}
.role-tab.active{background:var(--surface);color:var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:5px}
.form-group input,.form-group select{width:100%;padding:9px 12px;border:1px solid var(--border);
  border-radius:7px;font-family:'DM Sans',sans-serif;font-size:13px;background:var(--surface);
  color:var(--text);outline:none;transition:border-color .2s}
.form-group input:focus{border-color:var(--brand-mid)}
.btn-login{width:100%;padding:11px;background:var(--brand);color:white;border:none;border-radius:8px;
  font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:background .2s;margin-top:4px}
.btn-login:hover{background:var(--brand-mid)}
.login-note{text-align:center;font-size:11px;color:var(--muted);margin-top:16px}

/* ── APP SHELL ── */
#app{display:none;min-height:100vh}
.shell{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--brand);display:flex;flex-direction:column;
  position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto}
.sidebar-logo{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-logo .em{font-family:'Playfair Display',serif;font-size:11px;color:var(--gold);
  letter-spacing:.5px;display:block;margin-bottom:2px}
.sidebar-logo .name{font-family:'Playfair Display',serif;font-size:14px;color:white;font-weight:600;line-height:1.3}
.sidebar-logo .sub{font-size:10px;color:rgba(255,255,255,.45);margin-top:2px;display:block}
.sidebar-user{padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--gold);display:flex;
  align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--brand);flex-shrink:0}
.user-info .uname{font-size:12px;color:white;font-weight:500}
.user-info .urole{font-size:10px;color:rgba(255,255,255,.5);margin-top:1px}
.nav-section{padding:10px 0;flex:1}
.nav-label{font-size:9px;letter-spacing:1px;color:rgba(255,255,255,.3);padding:8px 18px 4px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 18px;cursor:pointer;
  color:rgba(255,255,255,.65);font-size:13px;transition:all .15s;border-left:3px solid transparent}
.nav-item:hover{background:rgba(255,255,255,.06);color:white}
.nav-item.active{background:rgba(255,255,255,.1);color:white;border-left-color:var(--gold)}
.nav-icon{font-size:14px;width:16px;text-align:center}
.sidebar-bottom{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08)}
.logout-btn{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.5);font-size:12px;cursor:pointer;padding:6px 0;transition:color .2s}
.logout-btn:hover{color:white}
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:56px;
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.topbar-title{font-family:'Playfair Display',serif;font-size:17px;color:var(--brand);font-weight:600}
.topbar-actions{display:flex;align-items:center;gap:10px}
.badge-pill{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.badge-pill.admin{background:#e8f0f9;color:var(--brand)}.badge-pill.agent{background:#e8f5ee;color:var(--success)}
.badge-pill.student{background:var(--gold-light);color:var(--gold)}
.notif-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:14px;color:var(--muted);position:relative}
.notif-dot{position:absolute;top:-4px;right:-4px;background:#e24b4b;color:white;
  font-size:9px;font-weight:600;width:16px;height:16px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;border:2px solid white}
.content{padding:24px;flex:1}

/* ── STAT CARDS ── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-card{background:var(--surface);border-radius:10px;padding:16px 18px;border:1px solid var(--border)}
.stat-label{font-size:11px;color:var(--muted);margin-bottom:6px}
.stat-val{font-size:24px;font-weight:500;color:var(--text);font-family:'Playfair Display',serif}
.stat-sub{font-size:11px;color:var(--muted);margin-top:4px}
.stat-icon{float:right;font-size:20px;opacity:.2;margin-top:-4px}

/* ── CARDS & TABLES ── */
.card{background:var(--surface);border-radius:10px;border:1px solid var(--border);overflow:hidden}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:13px;font-weight:500;color:var(--text)}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:500;color:var(--muted);padding:10px 16px;text-align:left;background:#f9fafb;border-bottom:1px solid var(--border)}
td{font-size:12px;padding:11px 16px;border-bottom:1px solid #f0f2f5;color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}tr:hover td{background:#fafbfc}
.empty-state{text-align:center;padding:40px;color:var(--muted);font-size:13px}

/* ── STATUS BADGES ── */
.status{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:500;white-space:nowrap}
.status.pending{background:var(--warn-bg);color:var(--warn)}
.status.reviewed{background:var(--brand-light);color:var(--brand)}
.status.approved{background:var(--success-bg);color:var(--success)}
.status.rejected{background:var(--danger-bg);color:var(--danger)}
.status.verified{background:var(--success-bg);color:var(--success)}
.status.active{background:var(--success-bg);color:var(--success)}
.status.inactive{background:#f0f2f5;color:var(--muted)}
.status.new{background:var(--brand-light);color:var(--brand)}

/* ── BUTTONS ── */
.btn{padding:6px 14px;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:12px;
  font-weight:500;cursor:pointer;border:none;transition:all .15s}
.btn-sm{padding:4px 10px;font-size:11px;border-radius:5px}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--brand-mid);color:var(--brand-mid)}
.btn-blue{background:var(--brand);color:white}.btn-blue:hover{background:var(--brand-mid)}
.btn-gold{background:var(--gold);color:white}.btn-gold:hover{background:#b07820}
.btn-success{background:var(--success);color:white;font-family:'DM Sans',sans-serif}
.btn-danger{background:var(--danger);color:white;font-family:'DM Sans',sans-serif}

/* ── FORMS ── */
.field-group{margin-bottom:14px}
.field-group label{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-bottom:5px}
.field-group input,.field-group select,.field-group textarea{width:100%;padding:8px 12px;
  border:1px solid var(--border);border-radius:7px;font-family:'DM Sans',sans-serif;
  font-size:13px;color:var(--text);background:var(--surface);outline:none;transition:border-color .2s}
.field-group input:focus,.field-group select:focus{border-color:var(--brand-mid)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.row{display:grid;gap:14px;margin-bottom:14px}
.row.col2{grid-template-columns:1fr 1fr}.row.col3{grid-template-columns:1fr 1fr 1fr}
.row.col-wide{grid-template-columns:2fr 1fr}

/* ── MISC ── */
.alert{padding:10px 14px;border-radius:7px;font-size:12px;margin-bottom:14px;display:flex;gap:8px}
.alert.info{background:var(--brand-light);color:var(--brand)}
.alert.success{background:var(--success-bg);color:var(--success)}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.danger{background:var(--danger-bg);color:var(--danger)}
.prog-bar{height:5px;background:#e8eaf0;border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .4s}
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab-item{padding:8px 16px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab-item.active{color:var(--brand);border-bottom-color:var(--brand)}
.upload-box{border:1.5px dashed var(--border);border-radius:8px;padding:20px;text-align:center;cursor:pointer;transition:all .2s;background:#fafbfc}
.upload-box:hover{border-color:var(--brand-mid);background:var(--brand-light)}
.timeline{padding:4px 0}
.tl-item{display:flex;gap:12px;padding:8px 0}
.tl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:3px}
.tl-dot.done{background:var(--success)}.tl-dot.current{background:var(--gold)}.tl-dot.pending-dot{background:#d0d5de}
.geo-banner{background:var(--brand);border-radius:10px;padding:14px 18px;color:white;display:flex;align-items:center;gap:12px;margin-bottom:14px}
.search-bar{display:flex;gap:8px;align-items:center}
.search-input{padding:7px 12px;border:1px solid var(--border);border-radius:7px;font-size:12px;
  font-family:'DM Sans',sans-serif;outline:none;color:var(--text);background:var(--surface);min-width:180px}
.search-input:focus{border-color:var(--brand-mid)}
.loading{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;padding:20px}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--brand-mid);
  border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;
  align-items:center;justify-content:center;z-index:200}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:12px;width:520px;max-height:85vh;
  overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:15px;font-weight:500;color:var(--text)}
.modal-close{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:transparent;
  cursor:pointer;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.modal-body{padding:20px 22px}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
</style>
</head>
<body>

<div id="toast-container"></div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="logo-emblem">ME</div>
    <div class="logo-name">Muthuvel Education<br>Enhancement Program</div>
    <span class="logo-sub">Parul University Recruitment Portal · PNG to India</span>
    <div class="role-tabs">
      <button class="role-tab active" onclick="selectRole('admin',this)">Admin</button>
      <button class="role-tab" onclick="selectRole('agent',this)">Agent</button>
      <button class="role-tab" onclick="selectRole('student',this)">Student</button>
    </div>
    <div class="form-group"><label>Email Address</label>
      <input type="email" id="login-email" value="admin@muthuvel.edu"></div>
    <div class="form-group"><label>Password</label>
      <input type="password" id="login-pass" value="Admin@2025"></div>
    <button class="btn-login" onclick="doLogin()">Sign In</button>
    <div class="login-note">🔒 Secure portal · MEEP Student Management System</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <span class="em">MEEP</span>
        <span class="name">Muthuvel Education</span>
        <span class="sub">Student Management Portal</span>
      </div>
      <div class="sidebar-user">
        <div class="user-avatar" id="sb-avatar">AD</div>
        <div class="user-info">
          <div class="uname" id="sb-name">Loading...</div>
          <div class="urole" id="sb-role">...</div>
        </div>
      </div>
      <nav class="nav-section" id="nav-menu"></nav>
      <div class="sidebar-bottom">
        <div class="logout-btn" onclick="doLogout()">⬅ Sign Out</div>
      </div>
    </aside>
    <main class="main">
      <div class="topbar">
        <div class="topbar-title" id="page-title">Dashboard</div>
        <div class="topbar-actions">
          <span class="badge-pill" id="role-badge">...</span>
          <div class="notif-btn" id="notif-btn" onclick="loadPanel('notifications')">
            🔔<span class="notif-dot" id="notif-count" style="display:none">0</span>
          </div>
        </div>
      </div>
      <div class="content" id="content-area">
        <div class="loading"><div class="spinner"></div> Loading...</div>
      </div>
    </main>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Modal</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script>
let currentRole = 'admin';
let currentPanel = '';

function toast(msg, type='info') {
  const icons = {success:'✅',error:'❌',info:'ℹ',warn:'⚠'};
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${icons[type]||'ℹ'}</span><span>${msg}</span>`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

const ROLE_CREDS = {
  admin:   { email:'admin@muthuvel.edu',      pw:'Admin@2025' },
  agent:   { email:'peter@kavali.pg',         pw:'Agent@2025' },
  student: { email:'james.tari@student.com',  pw:'Student@2025' }
};

function selectRole(role, btn) {
  currentRole = role;
  document.querySelectorAll('.role-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('login-email').value = ROLE_CREDS[role].email;
  document.getElementById('login-pass').value  = ROLE_CREDS[role].pw;
}

function doLogin() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  setupRole(currentRole);
  loadPanel('dashboard');
}

function doLogout() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

function setupRole(role) {
  const configs = {
    admin:   { name:'Dr. Anand Raj',    role:'Administrator · India',      avatar:'AR', badge:'Administrator', cls:'admin'   },
    agent:   { name:'Peter Kavali',     role:'Recruitment Agent · PNG',    avatar:'PK', badge:'Agent · PNG',   cls:'agent'   },
    student: { name:'James Tari',       role:'Student Applicant · PNG',    avatar:'JT', badge:'Student',       cls:'student' }
  };
  const c = configs[role];
  document.getElementById('sb-avatar').textContent = c.avatar;
  document.getElementById('sb-name').textContent   = c.name;
  document.getElementById('sb-role').textContent   = c.role;
  const rb = document.getElementById('role-badge');
  rb.textContent = c.badge; rb.className = `badge-pill ${c.cls}`;

  const menus = {
    admin: [
      {icon:'◼',label:'Dashboard',panel:'dashboard'},
      {icon:'👥',label:'Agents',panel:'agents'},
      {icon:'🎓',label:'Students',panel:'students'},
      {icon:'📋',label:'Applications',panel:'applications'},
      {icon:'📄',label:'Documents',panel:'documents'},
      {icon:'📊',label:'Reports',panel:'reports'},
      {icon:'⚙',label:'Settings',panel:'settings'},
    ],
    agent: [
      {icon:'◼',label:'Dashboard',panel:'dashboard'},
      {icon:'🎓',label:'My Students',panel:'students'},
      {icon:'📋',label:'Applications',panel:'applications'},
      {icon:'📄',label:'Documents',panel:'documents'},
      {icon:'➕',label:'Register Student',panel:'register'},
    ],
    student: [
      {icon:'◼',label:'My Dashboard',panel:'dashboard'},
      {icon:'👤',label:'My Profile',panel:'profile'},
      {icon:'📄',label:'Documents',panel:'documents'},
      {icon:'📋',label:'My Application',panel:'applications'},
      {icon:'🔔',label:'Notifications',panel:'notifications'},
    ]
  };

  const nav = document.getElementById('nav-menu');
  nav.innerHTML = '<div class="nav-label">Navigation</div>';
  (menus[role]||[]).forEach(item => {
    const d = document.createElement('div');
    d.className = 'nav-item'; d.dataset.panel = item.panel;
    d.innerHTML = `<span class="nav-icon">${item.icon}</span><span>${item.label}</span>`;
    d.onclick = () => loadPanel(item.panel);
    nav.appendChild(d);
  });
}

function loadPanel(panel) {
  currentPanel = panel;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.panel === panel));
  const titles = {dashboard:'Dashboard Overview',agents:'Agent Management',students:'Student Records',
    applications:'Applications',documents:'Document Management',reports:'Reports & Analytics',
    settings:'System Settings',register:'Register New Student',profile:'My Profile',notifications:'Notifications'};
  document.getElementById('page-title').textContent = titles[panel] || panel;
  const renders = {admin: renderAdmin, agent: renderAgent, student: renderStudent};
  document.getElementById('content-area').innerHTML = renders[currentRole](panel);
}

function set(html) { document.getElementById('content-area').innerHTML = html; }
function statusBadge(s) { return `<span class="status ${s||'pending'}">${s||'pending'}</span>`; }
function fmt(d) { return d ? new Date(d).toLocaleDateString('en-AU',{day:'2-digit',month:'short',year:'numeric'}) : '—'; }
function docRatio(total, verified) {
  const t=total||0, v=verified||0, pct=t>0?Math.round(v/t*100):0;
  return `<div style="font-size:11px;color:var(--muted);margin-bottom:2px">${v}/${t} verified</div>
          <div class="prog-bar" style="width:80px"><div class="prog-fill" style="width:${pct}%;background:${pct===100?'var(--success)':'var(--gold)'}"></div></div>`;
}

// ── ADMIN ──
function renderAdmin(panel) {
  if (panel==='dashboard')    return adminDashboard();
  if (panel==='agents')       return adminAgents();
  if (panel==='students')     return adminStudents();
  if (panel==='applications') return adminApplications();
  if (panel==='documents')    return adminDocuments();
  if (panel==='reports')      return adminReports();
  if (panel==='settings')     return adminSettings();

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');

function filterTable(input, tableId) {
  const q = input.value.toLowerCase();
  document.querySelectorAll(`#${tableId} tbody tr`).forEach(row => {
    row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}

document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
